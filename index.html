<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Movie Watch</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        linear-gradient(
          135deg,
          #12051f,
          #090b20,
          #16051f
        );
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 45px 20px;
      text-align: center;
      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #ec4899
        );
    }

    header h1 {
      margin: 0;
      font-size: 45px;
    }

    header p {
      opacity: .85;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 30px 20px;
    }

    .upload-box {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 30px;
    }

    .upload-box h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #555;
      background: #151526;
      color: white;
    }

    input[type="file"] {
      padding: 10px;
    }

    button {
      border: 0;
      padding: 14px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      background: linear-gradient(
        135deg,
        #ec4899,
        #8b5cf6
      );
      color: white;
      margin-top: 10px;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }

    .preview {
      display: none;
      width: 220px;
      margin-top: 15px;
      border-radius: 12px;
    }

    .movies {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fill,
          minmax(240px, 1fr)
        );
      gap: 20px;
    }

    .movie {
      background: rgba(255,255,255,.08);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.1);
    }

    .poster {
      width: 100%;
      height: 300px;
      object-fit: cover;
      background: #111;
    }

    .no-poster {
      width: 100%;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #17172a;
      color: #aaa;
    }

    .movie-info {
      padding: 15px;
    }

    .movie-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    video {
      width: 100%;
      max-height: 450px;
      background: black;
      border-radius: 10px;
      margin-top: 10px;
    }

    .delete {
      background: #dc2626;
      width: 100%;
    }

    .empty {
      text-align: center;
      padding: 50px;
      opacity: .6;
    }

  </style>
</head>

<body>

<header>

  <h1>My Movie Watch</h1>

  <p>
    Your personal movie collection
  </p>

</header>

<div class="container">

  <div class="upload-box">

    <h2>
      🎬 Add a New Movie
    </h2>

    <input
      id="title"
      type="text"
      placeholder="Movie title"
    >

    <input
      id="video"
      type="file"
      accept="video/*"
    >

    <input
      id="poster"
      type="file"
      accept="image/jpeg,image/png,image/webp"
    >

    <img
      id="preview"
      class="preview"
      alt="Thumbnail preview"
    >

    <br>

    <button
      id="uploadBtn"
      onclick="uploadMovie()"
    >
      Upload Movie
    </button>

    <div id="status"></div>

  </div>

  <h2>
    🎥 My Movies
  </h2>

  <div
    id="movies"
    class="movies"
  ></div>

</div>

<script>

  const titleInput =
    document.getElementById("title");

  const videoInput =
    document.getElementById("video");

  const posterInput =
    document.getElementById("poster");

  const preview =
    document.getElementById("preview");

  const statusBox =
    document.getElementById("status");

  const uploadBtn =
    document.getElementById("uploadBtn");

  // =========================
  // THUMBNAIL PREVIEW
  // =========================

  posterInput.addEventListener(
    "change",
    () => {

      const file =
        posterInput.files[0];

      if (!file) {

        preview.style.display =
          "none";

        return;

      }

      preview.src =
        URL.createObjectURL(file);

      preview.style.display =
        "block";

    }
  );

  // =========================
  // UPLOAD
  // =========================

  async function uploadMovie() {

    const title =
      titleInput.value.trim();

    const video =
      videoInput.files[0];

    const poster =
      posterInput.files[0];

    if (!title) {

      statusBox.textContent =
        "❌ Please enter movie title.";

      return;

    }

    if (!video) {

      statusBox.textContent =
        "❌ Please select a video.";

      return;

    }

    uploadBtn.disabled = true;

    statusBox.textContent =
      "⏳ Uploading movie...";

    try {

      const formData =
        new FormData();

      // IMPORTANT:
      // These names MUST match server.js

      formData.append(
        "title",
        title
      );

      formData.append(
        "video",
        video
      );

      if (poster) {

        formData.append(
          "poster",
          poster
        );

      }

      const response =
        await fetch(
          "/api/upload",
          {
            method: "POST",
            body: formData
          }
        );

      const result =
        await response.json();

      if (!response.ok) {

        throw new Error(
          result.error ||
          "Upload failed"
        );

      }

      statusBox.textContent =
        "✅ Movie uploaded successfully!";

      titleInput.value = "";
      videoInput.value = "";
      posterInput.value = "";

      preview.style.display =
        "none";

      await loadMovies();

    } catch (error) {

      console.error(error);

      statusBox.textContent =
        "❌ " +
        error.message;

    }

    uploadBtn.disabled = false;

  }

  // =========================
  // LOAD MOVIES
  // =========================

  async function loadMovies() {

    const container =
      document.getElementById(
        "movies"
      );

    container.innerHTML =
      "<div class='empty'>Loading movies...</div>";

    try {

      const response =
        await fetch(
          "/api/videos"
        );

      const movies =
        await response.json();

      if (!movies.length) {

        container.innerHTML =
          "<div class='empty'>" +
          "No movies uploaded yet." +
          "</div>";

        return;

      }

      container.innerHTML =
        movies.map(movie => {

          const posterHTML =
            movie.poster

              ? `
                <img
                  class="poster"
                  src="${movie.poster}"
                  alt="${escapeHTML(movie.title)}"
                >
              `

              : `
                <div class="no-poster">
                  No Thumbnail
                </div>
              `;

          return `

            <div class="movie">

              ${posterHTML}

              <div class="movie-info">

                <div class="movie-title">
                  ${escapeHTML(movie.title)}
                </div>

                <video
                  controls
                  preload="metadata"
                  src="${movie.url}"
                ></video>

                <button
                  class="delete"
                  onclick="deleteMovie('${movie.id}')"
                >
                  🗑 Delete Movie
                </button>

              </div>

            </div>

          `;

        }).join("");

    } catch (error) {

      container.innerHTML =
        "<div class='empty'>" +
        "❌ Could not load movies." +
        "</div>";

      console.error(error);

    }

  }

  // =========================
  // DELETE
  // =========================

  async function deleteMovie(id) {

    const confirmDelete =
      confirm(
        "Delete this movie?"
      );

    if (!confirmDelete) {
      return;
    }

    try {

      const response =
        await fetch(
          "/api/videos/" +
          encodeURIComponent(id),
          {
            method: "DELETE"
          }
        );

      const result =
        await response.json();

      if (!response.ok) {

        throw new Error(
          result.error ||
          "Delete failed"
        );

      }

      await loadMovies();

    } catch (error) {

      alert(
        "❌ " +
        error.message
      );

    }

  }

  // =========================
  // HTML ESCAPE
  // =========================

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }

  // =========================
  // START
  // =========================

  loadMovies();

</script>

</body>
</html>
